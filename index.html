<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tecno — Procesos Industriales</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0f; color: #e0e0f0; min-height: 100vh;
  }

  /* ── HEADER ── */
  .header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10,10,15,0.96); backdrop-filter: blur(14px);
    border-bottom: 1px solid #1e1e2e; padding: 14px 20px 0;
  }
  .header-top {
    display: flex; align-items: center; gap: 12px;
    flex-wrap: wrap; padding-bottom: 12px;
  }
  .header h1 { font-size: 18px; font-weight: 800; color: #38bdf8; white-space: nowrap; }
  .header-count { font-size: 12px; color: #555; white-space: nowrap; }
  .search-wrap { flex: 1; min-width: 160px; }
  .search-input {
    width: 100%; background: #141420; border: 1px solid #2a2a3e;
    color: #e0e0f0; padding: 8px 14px; border-radius: 8px;
    font-size: 13px; outline: none; transition: border-color .2s;
  }
  .search-input:focus { border-color: #38bdf8; }
  .search-input::placeholder { color: #444; }
  .btn-edit-mode {
    background: #141420; border: 1px solid #2a2a3e; color: #888;
    padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all .2s; white-space: nowrap; touch-action: manipulation;
  }
  .btn-edit-mode:hover { border-color: #fbbf24; color: #fbbf24; }
  .btn-edit-mode.active { background: #2a1a00; border-color: #fbbf24; color: #fbbf24; }

  /* ── TAG FILTER BAR ── */
  .tag-bar {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px;
    scrollbar-width: none;
  }
  .tag-bar::-webkit-scrollbar { display: none; }
  .tag-pill {
    flex-shrink: 0; background: #141420; border: 1px solid #2a2a3e;
    color: #888; padding: 5px 13px; border-radius: 20px;
    font-size: 12px; font-weight: 500; cursor: pointer;
    transition: all .15s; white-space: nowrap;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .tag-pill:hover { border-color: #38bdf8; color: #e0e0f0; }
  .tag-pill.active { background: #0c3a55; border-color: #38bdf8; color: #38bdf8; font-weight: 700; }
  .tag-pill.all-pill.active { background: #1a103a; border-color: #818cf8; color: #818cf8; }

  /* ── GRID ── */
  .main { padding: 20px; max-width: 1200px; margin: 0 auto; }
  .results-info { font-size: 12px; color: #555; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px,1fr)); gap: 14px; }
  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; }
    .btn-edit-mode { padding: 10px 14px; font-size: 13px; }
    .tag-toggle { padding: 8px 14px; font-size: 12px; }
    .btn-save-tags, .btn-cancel-tags { padding: 12px; font-size: 13px; }
    .editor-title-input { font-size: 15px; padding: 10px 12px; }
    .new-tag-input { font-size: 14px; padding: 8px 12px; }
    .card-thumb { aspect-ratio: 16/9; }
  }

  /* ── CARD ── */
  .card {
    background: #12121a; border: 1px solid #1e1e2e; border-radius: 14px;
    padding: 16px; display: flex; flex-direction: column; gap: 10px;
    transition: border-color .2s, box-shadow .2s;
  }
  .card:hover { border-color: #38bdf820; box-shadow: 0 4px 24px rgba(56,189,248,.06); }
  .card.hidden { display: none; }
  .card.edited { border-color: #fbbf2440; }

  /* TÍTULO MANUAL — máxima jerarquía */
  .card-title {
    font-size: 14px; font-weight: 700; color: #e8e8f8; line-height: 1.4;
    border-left: 3px solid #38bdf8; padding-left: 10px;
  }

  /* DESCRIPTION — protagonista */
  .card-desc {
    font-size: 12.5px; color: #8888a8; line-height: 1.55;
    display: -webkit-box; -webkit-line-clamp: 4;
    -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-desc.empty { color: #3a3a5a; font-style: italic; font-size: 12px; }
  .card-desc.auto-only {
    font-size: 13px; color: #c0c0d8; -webkit-line-clamp: 5;
  }

  /* SOURCE — secundario */
  .card-source {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: #444;
  }
  .ig-icon { width: 11px; height: 11px; opacity: .4; flex-shrink: 0; }
  .card-source a { color: #555; text-decoration: none; transition: color .15s; }
  .card-source a:hover { color: #38bdf8; }

  /* TAGS ROW */
  .card-tags-row { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .card-tag {
    font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 12px;
    border: 1px solid transparent; cursor: pointer; transition: all .15s; touch-action: manipulation;
  }
  .btn-edit-card {
    margin-left: auto; flex-shrink: 0; background: none;
    border: 1px dashed #2a2a3e; color: #444;
    padding: 2px 8px; border-radius: 8px; font-size: 10px; cursor: pointer;
    transition: all .15s; display: none; touch-action: manipulation;
  }
  .edit-mode-on .btn-edit-card { display: block; }
  .btn-edit-card:hover { border-color: #fbbf24; color: #fbbf24; }

  /* TAG EDITOR */
  .tag-editor {
    display: none; flex-direction: column; gap: 10px;
    background: #0e0e18; border: 1px solid #2a2a3e; border-radius: 10px; padding: 12px;
  }
  .tag-editor.open { display: flex; }
  .tag-editor-label { font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: .05em; }
  .tag-editor-grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag-toggle {
    font-size: 11px; font-weight: 600; padding: 5px 11px; border-radius: 12px;
    border: 1px solid #2a2a3e; background: #141420; color: #666;
    cursor: pointer; transition: all .15s; touch-action: manipulation;
  }
  .tag-toggle.on { border-color: transparent; }

  /* TÍTULO MANUAL en editor */
  .editor-title-wrap { display: flex; flex-direction: column; gap: 5px; }
  .editor-title-input {
    width: 100%; background: #12121e; border: 1px solid #38bdf840; color: #e8e8f8;
    padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 600;
    outline: none; transition: border-color .2s; resize: none;
    font-family: inherit;
  }
  .editor-title-input:focus { border-color: #38bdf8; }
  .editor-title-input::placeholder { color: #444; font-weight: 400; }

  /* NEW CATEGORY INPUT */
  .new-tag-row { display: flex; gap: 6px; }
  .new-tag-input {
    flex: 1; background: #141420; border: 1px solid #2a2a3e; color: #e0e0f0;
    padding: 6px 10px; border-radius: 8px; font-size: 12px; outline: none;
    transition: border-color .2s;
  }
  .new-tag-input:focus { border-color: #38bdf8; }
  .new-tag-input::placeholder { color: #444; }
  .btn-add-tag {
    background: #141420; border: 1px solid #2a2a3e; color: #888;
    padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer;
    transition: all .15s; white-space: nowrap; touch-action: manipulation;
  }
  .btn-add-tag:hover { border-color: #38bdf8; color: #38bdf8; }

  .tag-editor-actions { display: flex; gap: 8px; }
  .btn-save-tags {
    flex: 1; background: #0c3a55; border: 1px solid #38bdf8; color: #38bdf8;
    padding: 8px; border-radius: 8px; font-size: 12px; font-weight: 700;
    cursor: pointer; touch-action: manipulation;
  }
  .btn-save-tags:hover { background: #122a42; }
  .btn-cancel-tags {
    background: #141420; border: 1px solid #2a2a3e; color: #666;
    padding: 8px 14px; border-radius: 8px; font-size: 12px; cursor: pointer; touch-action: manipulation;
  }

  /* POST LINK */
  .btn-post {
    display: block; background: #0c1a2a; border: 1px solid #1e3a55;
    color: #38bdf8; padding: 8px 12px; border-radius: 8px;
    font-size: 12px; font-weight: 600; text-decoration: none;
    text-align: center; transition: all .15s; touch-action: manipulation;
    letter-spacing: .01em;
  }
  .btn-post:hover { background: #122a42; border-color: #38bdf8; }

  /* TOAST */
  .toast {
    position: fixed; bottom: 20px; right: 16px; left: 16px;
    background: #0c3a55; color: #38bdf8;
    padding: 12px 20px; border-radius: 10px; font-size: 13px; font-weight: 600;
    box-shadow: 0 8px 32px rgba(0,0,0,.5);
    transform: translateY(100px); opacity: 0;
    transition: all .3s ease; z-index: 200; text-align: center;
  }
  @media (min-width: 600px) { .toast { left: auto; max-width: 320px; } }
  .toast.show { transform: translateY(0); opacity: 1; }

  .no-results {
    grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #444; font-size: 14px;
  }

  /* THUMBNAIL */
  .card-thumb {
    width: 100%; aspect-ratio: 1/1; object-fit: cover;
    border-radius: 8px; display: block;
    background: #1a1a2a;
  }
</style>
</head>

<div class="header">
  <div class="header-top">

  </div>
  <div class="tag-bar" id="tagBar"></div>
</div>

<div class="main">
  <div class="results-info" id="resultsInfo"></div>
  <div class="grid" id="grid"></div>
</div>

<div class="toast" id="toast"></div>

#industrial #industrialmachinery", "titulo": "", "owner_name": "Protolabs", "username": "protolabsmfg", "tags": ["CNC / Mecanizado", "Chapa / Plegado", "Metalurgia", "Plásticos / Polímeros"], "thumbnail": "thumbnails/CpxZ03sDzHg.jpg"}, {"url": "https://www.instagram.com/reel/CnF51Q_okq9/", "descripcion": "Making the mold really is 90% of the work when it comes to making completely new composite parts from digital designs, and the process to get there has so many steps. These relatively simple interior panels that are destined to be made from carbon start out as male pattern plugs, machined from wood in this case on my @matterhackers Shapeoko CNC. From there they are primed and built high with Duratec primer, blocked flat and polished to a high gloss. After release wax and sprayed PVA is applied, tooling gel is sprayed on with a dump gun and the part is laid up with fiberglass. Some simple foam noodles are cut in half and used as profiles to add reinforcement around the mold for rigidity, and the mold is pulled off the plug with a satisfying release. A quick polish on the gel coat and this new mold is ready for carbon layup and infusion over the weekend! 🤓\n\n#mikebuildsadatsun #datsun #datsun620 #design #engineering #mechanicalengineering #cad #solidworks #fusion360 #cnc #shapeoko #machining #cam #composites #carbon #carbonfiber #moldmaking #patternmaking #fiberglass #resininfusion #whocanguesshowmanyhours #munsseyandpaulknow", "titulo": "Fabricacion de matriz en MDF", "owner_name": "Mike OBrien", "username": "3d_magic_mike", "tags": ["CNC / Mecanizado", "Composites / Fibra", "Plásticos / Polímeros", "Artesanía / Craft"], "thumbnail": "thumbnails/CnF51Q_okq9.jpg"}, {"url": "https://www.instagram.com/reel/CmBmXkWjerN/", "descripcion": "Amazing work..\nCredit : @tranyond_machine_tool\n🌺🌺Follow @industrial.highlights to see more.. \n. \n------------------------------------------------------------\n💡💡 DM for credit or removal request (no copyright infringement intended)   "Estampado / Forja","Metalurgia","Plásticos / Polímeros","Artesanía / Craft",
  "Fabricación AR","Serigrafía","Joyería","Alimentaria"
];

const TAG_COLORS = {
  "Termoformado":           ["#0c4a3a","#10b981"],
  "Moldeo por inyección":   ["#3b1d6e","#a78bfa"],
  "Soplado":                ["#0c3a55","#38bdf8"],
  "CNC / Mecanizado":       ["#1a2a0a","#84cc16"],
  "Corte láser":            ["#3a1a00","#fb923c"],
  "Chapa / Plegado":        ["#2a1a00","#fbbf24"],
  "Impresión 3D":           ["#1e0a3a","#c084fc"],
  "Composites / Fibra":     ["#0a2a1a","#34d399"],
  "Estampado / Forja":      ["#1a0a0a","#f87171"],
  "Metalurgia":             ["#1a1a1a","#94a3b8"],
  "Plásticos / Polímeros":  ["#0a1a3a","#60a5fa"],
  "Artesanía / Craft":      ["#2a1a0a","#f59e0b"],
  "Fabricación AR":         ["#1a2a0a","#4ade80"],
  "Serigrafía":             ["#2a0a2a","#e879f9"],
  "Joyería":                ["#2a1a00","#fcd34d"],
  "Alimentaria":            ["#1a0a0a","#fb7185"],
  "Sin clasificar":         ["#1a1a2a","#6b7280"],
};

// paleta para categorías custom (cycling)
const CUSTOM_PALETTE = [
  ["#1a0a2a","#d946ef"],["#0a2a2a","#06b6d4"],["#2a0a0a","#f43f5e"],
  ["#0a1a0a","#22d3ee"],["#2a1a2a","#a855f7"],["#1a2a0a","#86efac"],
];
let paletteIdx = 0;

function tagStyle(tag) {
  const [bg, fg] = TAG_COLORS[tag] || ["#1a1a2a","#888"];
  return `background:${bg};color:${fg};border-color:${fg}40`;
}
function tagBg(tag)  { return (TAG_COLORS[tag]||["#1a1a2a"])[0]; }
function tagFg(tag)  { return (TAG_COLORS[tag]||["","#888"])[1]; }

// ── Persistent state ───────────────────────────────────────────────────────
let customTags   = {};
let customCats   = [];
let customTitles = {};  // idx -> string título manual
try { customTags   = JSON.parse(localStorage.getItem(LS_KEY)||'{}'); } catch(e){}
try { customCats   = JSON.parse(localStorage.getItem(LS_CATS_KEY)||'[]'); } catch(e){}
try { customTitles = JSON.parse(localStorage.getItem(LS_TITLES_KEY)||'{}'); } catch(e){}

// Categorías sembradas — disponibles en cualquier browser sin depender de localStorage.
const SEED_CATS = ["ELIMINAR", "Espuma de poliuretano", "Ceramicas / Vidrio", "PVC", "Juguetes", "Ensamblado", "Impresion / Estampa", "Forja", "Laser", "Madera / fibras naturales", "multilaminado", "Mobiliario", "Reciclaje"];
SEED_CATS.forEach(c => { if (!customCats.includes(c)) customCats.push(c); });

customCats.forEach(c => {
  if (!TAG_COLORS[c]) {
    TAG_COLORS[c] = CUSTOM_PALETTE[paletteIdx % CUSTOM_PALETTE.length];
    paletteIdx++;
  }
});

function saveAll() {
  localStorage.setItem(LS_KEY,        JSON.stringify(customTags));
  localStorage.setItem(LS_CATS_KEY,   JSON.stringify(customCats));
  localStorage.setItem(LS_TITLES_KEY, JSON.stringify(customTitles));
}

function allAvailableTags() { return [...BASE_TAGS, ...customCats]; }
function getPostTags(i) { return customTags[i] !== undefined ? customTags[i] : POSTS[i].tags; }

// ── State ──────────────────────────────────────────────────────────────────
let activeTag = 'all';
let editMode  = false;

// ── Tag bar ────────────────────────────────────────────────────────────────
const tagBar = document.getElementById('tagBar');
let tagPills = {};

function buildTagBar() {
  tagBar.innerHTML = ''; tagPills = {};
  const counts = {};
  POSTS.forEach((_,i) => getPostTags(i).forEach(t => { counts[t]=(counts[t]||0)+1; }));
  const usedTags = [...new Set(POSTS.flatMap((_,i) => getPostTags(i)))].sort();

  function makePill(label, isAll=false) {
    const pill = document.createElement('button');
    pill.className = 'tag-pill' + (isAll?' all-pill':'');
    if ((isAll && activeTag==='all')||(!isAll && activeTag===label)) pill.classList.add('active');
    const cnt = isAll ? POSTS.length : (counts[label]||0);
    pill.innerHTML = `${label} <span style="opacity:.5;font-size:10px">(${cnt})</span>`;
    pill.addEventListener('click', () => {
      activeTag = isAll ? 'all' : label;
      document.querySelectorAll('.tag-pill').forEach(p=>p.classList.remove('active'));
      pill.classList.add('active');
      applyFilters();
    });
    if (!isAll) tagPills[label] = pill;
    return pill;
  }
  tagBar.appendChild(makePill('Todos', true));
  usedTags.forEach(t => tagBar.appendChild(makePill(t)));
}

// ── Render cards ───────────────────────────────────────────────────────────
const grid = document.getElementById('grid');

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderTagsRow(cardEl, idx) {
  const tags    = getPostTags(idx);
  const edited  = customTags[idx] !== undefined;
  const row     = cardEl.querySelector('.card-tags-row');
  row.innerHTML =
    tags.map(t =>
      `<span class="card-tag" style="${tagStyle(t)}"
        onclick="filterByTag('${escHtml(t)}')">${escHtml(t)}</span>`
    ).join('') +
    `<button class="btn-edit-card" onclick="openEditor(${idx})">` +
      (edited ? '✏️·' : '✏️') +
    `</button>`;
  cardEl.classList.toggle('edited', edited);
  cardEl.dataset.tags = JSON.stringify(tags);
}

function buildEditorGrid(idx) {
  const current = getPostTags(idx);
  const edGrid  = document.getElementById('editor-grid-' + idx);
  edGrid.innerHTML = '';
  allAvailableTags().forEach(t => {
    const on = current.includes(t);
    const btn = document.createElement('button');
    btn.className = 'tag-toggle' + (on?' on':'');
    btn.textContent = t;
    btn.style.cssText = on ? `background:${tagBg(t)};color:${tagFg(t)};border-color:${tagFg(t)};` : '';
    btn.addEventListener('click', () => {
      btn.classList.toggle('on');
      const now = btn.classList.contains('on');
      btn.style.cssText = now ? `background:${tagBg(t)};color:${tagFg(t)};border-color:${tagFg(t)};` : '';
    });
    edGrid.appendChild(btn);
  });
}

POSTS.forEach((p, i) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'card-' + i;
  card.dataset.index = i;
  card.dataset.text  = ((p.descripcion||'') + ' ' + p.username + ' ' + (p.owner_name||'')).toLowerCase();

  const desc      = (p.descripcion||'').trim();
  const igPost    = p.url;
  const igProfile = 'https://instagram.com/' + p.username;

  // renderContent se llama también al guardar para actualizar la card sin recronstruirla
  function renderContent(cardEl) {
    const manualTitle = customTitles[i] || '';
    const titleEl  = cardEl.querySelector('.card-title');
    const descEl   = cardEl.querySelector('.card-desc');
    if (manualTitle) {
      titleEl.textContent = manualTitle;
      titleEl.style.display = 'block';
      if (desc) {
        descEl.textContent = desc;
        descEl.className = 'card-desc';
        descEl.style.display = '-webkit-box';
      } else {
        descEl.style.display = 'none';
      }
    } else {
      titleEl.style.display = 'none';
      if (desc) {
        descEl.textContent = desc;
        descEl.className = 'card-desc auto-only';
        descEl.style.display = '-webkit-box';
      } else {
        descEl.textContent = 'Sin descripción';
        descEl.className = 'card-desc empty';
        descEl.style.display = 'block';
      }
    }
  }

  card.innerHTML =
    (p.thumbnail ? `<img class="card-thumb" src="${escHtml(p.thumbnail)}" loading="lazy" alt="">` : '') +
    `<p class="card-title"></p>` +
    `<p class="card-desc"></p>` +
    // fuente — secundaria
    `<div class="card-source">` +
      `<svg class="ig-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>` +
      `<a href="${igProfile}" target="_blank">@${escHtml(p.username)}</a>` +
      (p.owner_name ? `<span>· ${escHtml(p.owner_name)}</span>` : '') +
    `</div>` +
    // tags
    `<div class="card-tags-row"></div>` +
    // editor panel
    `<div class="tag-editor" id="editor-${i}">` +
      `<div class="editor-title-wrap">` +
        `<div class="tag-editor-label">Título / descripción breve</div>` +
        `<textarea class="editor-title-input" id="title-input-${i}" rows="2"` +
          ` placeholder="Ej: Doblado de acrílico con calor..."></textarea>` +
      `</div>` +
      `<div class="tag-editor-label">Tags de proceso</div>` +
      `<div class="tag-editor-grid" id="editor-grid-${i}"></div>` +
      `<div class="new-tag-row">` +
        `<input class="new-tag-input" id="new-tag-input-${i}" placeholder="Nueva categoría..." maxlength="40">` +
        `<button class="btn-add-tag" onclick="addCustomTag(${i})">+ Agregar</button>` +
      `</div>` +
      `<div class="tag-editor-actions">` +
        `<button class="btn-save-tags" onclick="saveEditor(${i})">✓ Guardar</button>` +
        `<button class="btn-cancel-tags" onclick="closeEditor(${i})">Cancelar</button>` +
      `</div>` +
    `</div>` +

    `<a href="${escHtml(igPost)}" target="_blank" class="btn-post">▶ Ver publicación en Instagram</a>`;

  grid.appendChild(card);
  renderContent(card);
  renderTagsRow(card, i);

  // closure: expose renderContent so saveEditor can call it
  card._renderContent = renderContent;
});

// ── Edit mode ──────────────────────────────────────────────────────────────
function toggleEditMode() {
  editMode = !editMode;
  grid.classList.toggle('edit-mode-on', editMode);
  const btn = document.getElementById('btnEditMode');
  btn.classList.toggle('active', editMode);
  btn.textContent = editMode ? '✕ Cerrar edición' : '✏️ Editar tags';
}

// ── Editor ─────────────────────────────────────────────────────────────────
let openEditorIdx = null;

function openEditor(idx) {
  if (openEditorIdx !== null && openEditorIdx !== idx) closeEditor(openEditorIdx);
  openEditorIdx = idx;
  buildEditorGrid(idx);
  document.getElementById('editor-' + idx).classList.add('open');
  document.getElementById('new-tag-input-' + idx).value = '';
  // pre-cargar título existente
  const titleInput = document.getElementById('title-input-' + idx);
  titleInput.value = customTitles[idx] || '';
  titleInput.focus();
}

function closeEditor(idx) {
  document.getElementById('editor-' + idx).classList.remove('open');
  if (openEditorIdx === idx) openEditorIdx = null;
}

function addCustomTag(idx) {
  const input = document.getElementById('new-tag-input-' + idx);
  const name  = input.value.trim();
  if (!name) return;
  if (!TAG_COLORS[name]) {
    TAG_COLORS[name] = CUSTOM_PALETTE[paletteIdx % CUSTOM_PALETTE.length];
    paletteIdx++;
  }
  if (!customCats.includes(name)) { customCats.push(name); saveAll(); }
  input.value = '';
  buildEditorGrid(idx);  // rebuild with new tag already toggleable
  // auto-select the new tag
  const btns = document.querySelectorAll(`#editor-grid-${idx} .tag-toggle`);
  btns.forEach(b => {
    if (b.textContent === name) {
      b.classList.add('on');
      b.style.cssText = `background:${tagBg(name)};color:${tagFg(name)};border-color:${tagFg(name)};`;
    }
  });
  showToast(`Categoría "${name}" creada`);
}

function saveEditor(idx) {
  // guardar título manual (no pisa nada automático futuro)
  const titleVal = document.getElementById('title-input-' + idx).value.trim();
  if (titleVal) { customTitles[idx] = titleVal; }
  else { delete customTitles[idx]; }

  // guardar tags
  const selected = [...document.querySelectorAll(`#editor-grid-${idx} .tag-toggle.on`)]
    .map(b => b.textContent.trim());
  customTags[idx] = selected.length ? selected : ['Sin clasificar'];

  saveAll();
  closeEditor(idx);

  const cardEl = document.getElementById('card-' + idx);
  cardEl._renderContent(cardEl);   // actualiza título + desc sin recargar
  renderTagsRow(cardEl, idx);
  buildTagBar();
  applyFilters();
  showToast('Guardado ✓');
}

// ── Filters ────────────────────────────────────────────────────────────────
function filterByTag(tag) {
  activeTag = tag;
  document.querySelectorAll('.tag-pill').forEach(p=>p.classList.remove('active'));
  (tagPills[tag] || document.querySelector('.all-pill')).classList.add('active');
  applyFilters();
  document.querySelector('.tag-pill.active')
    ?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
}

function applyFilters() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  let visible = 0;
  document.querySelectorAll('.card').forEach(card => {
    const idx  = +card.dataset.index;
    const tags = getPostTags(idx);
    const text = card.dataset.text;
    const show = (activeTag==='all' || tags.includes(activeTag)) && (!q || text.includes(q));
    card.classList.toggle('hidden', !show);
    if (show) visible++;
  });
  const total = POSTS.length;
  document.getElementById('resultsInfo').textContent =
    visible === total ? `${total} posts` : `${visible} de ${total} posts`;
  document.getElementById('headerCount').textContent = `${total} posts`;
  let noRes = document.querySelector('.no-results');
  if (!visible) {
    if (!noRes) { noRes=document.createElement('div'); noRes.className='no-results'; grid.appendChild(noRes); }
    noRes.textContent = 'Sin resultados';
  } else if (noRes) noRes.remove();
}

// ── Toast ──────────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

// ── Exportar clasificación a archivo (para deploy / persistencia) ────────────
function exportData() {
  const data = {
    profile:      'Tecno',
    customTags:   customTags,
    customCats:   customCats,
    customTitles: customTitles,
    exported:     new Date().toISOString(),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tecno_classification.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
  showToast('Clasificación exportada ✓ — guardala en la carpeta Tecno');
}

buildTagBar();
applyFilters();
</script>
